<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 400px;
            max-width: 100%;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #eeeeee;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group > label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox-group label {
            display: block;
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 7px;
        }

        button {
            background-color: #087cf0;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #0565c5;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Formulir Data Diri</h2>

        <form action="proses_data_diri.php" method="POST">

            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    required
                >
            </div>

            <div class="form-group">
                <label for="tanggal_lahir">Tanggal Lahir:</label>
                <input
                    type="date"
                    id="tanggal_lahir"
                    name="tanggal_lahir"
                    required
                >
            </div>

            <div class="form-group">
                <label>Hobi:</label>

                <div class="checkbox-group">

                    <label>
                        <input
                            type="checkbox"
                            name="hobi[]"
                            value="Membaca"
                        >
                        Membaca
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="hobi[]"
                            value="Olahraga"
                        >
                        Olahraga
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="hobi[]"
                            value="Musik"
                        >
                        Musik
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="hobi[]"
                            value="Lainnya"
                        >
                        Lainnya
                    </label>

                </div>
            </div>

            <button type="submit">Kirim</button>

        </form>

    </div>

</body>
</html>
